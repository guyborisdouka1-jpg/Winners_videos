<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Winners' English Center, Cocody Riviera Palmeraie : cours d'anglais en groupe, en privé, en ligne et à domicile, du niveau A1 au C2. Test de niveau gratuit.">
<meta property="og:title" content="Winners' English Center">
<meta property="og:description" content="Parlez anglais avec confiance. Test de niveau gratuit, Promo Anglais Noël.">
<meta property="og:image" content="https://guyborisdouka1-jpg.github.io/Winners_videos/img/promo_noel.jpg">
<link rel="icon" href="../img/icon-192.png">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Winners' English Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style id="site-style">
/* Layout: fixed header + section chips rail, alternating cream/navy bands, magazine grids that collapse to one column on phones. */
:root{
  --navy:#1B2A4A; --navy-2:#24365e; --red:#C8102E; --red-ink:#a50d26; --gold:#D4AF37; --cream:#F7F5F0;
  --bg:#F7F5F0; --surface:#ffffff; --surface-2:#efebe2; --fg:#1B2A4A; --muted:#5b6478; --line:#ddd6c8;
  --band:#1B2A4A; --band-fg:#F7F5F0; --band-muted:#b9c2d6;
  --f-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --f-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'Space Mono', ui-monospace, 'Courier New', monospace;
  --r:14px; --shadow:0 10px 30px -14px rgba(27,42,74,.35);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111a2e; --surface:#18233d; --surface-2:#1e2b49; --fg:#F2EEE4; --muted:#a8b2c8; --line:#2c3b5f;
  --band:#0b1222; --band-fg:#F2EEE4; --band-muted:#a8b2c8; --navy:#d9e0f0; --red:#e0324d; --red-ink:#ff5c74; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111a2e; --surface:#18233d; --surface-2:#1e2b49; --fg:#F2EEE4; --muted:#a8b2c8; --line:#2c3b5f;
  --band:#0b1222; --band-fg:#F2EEE4; --band-muted:#a8b2c8; --navy:#d9e0f0; --red:#e0324d; --red-ink:#ff5c74; color-scheme:dark }
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:128px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.85em 1.4em;border-radius:999px;border:0;font:600 .98rem/1 var(--f-body);cursor:pointer;text-decoration:none;transition:transform .15s ease, background .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-red{background:#C8102E;color:#fff}.btn-red:hover{background:#a50d26}
.btn-gold{background:var(--gold);color:#1B2A4A}
.btn-ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn-wa{background:#1f9d55;color:#fff}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-row{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand img{width:44px;height:44px;border-radius:50%}
.brand b{font-family:var(--f-display);font-size:1.12rem;line-height:1.1;white-space:nowrap}
.brand small{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;gap:18px;margin-left:auto;font-weight:500;font-size:.94rem}
.nav a{text-decoration:none;color:var(--muted)}.nav a:hover{color:var(--fg)}
.hdr .btn{padding:.6em 1.05em;font-size:.88rem}
@media (max-width:900px){.nav{display:none}.hdr .btn{margin-left:auto}}
.brand span{min-width:0;overflow:hidden}.brand b{display:block;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.brand small{display:none}.hdr .btn span{display:none}.brand b{font-size:1rem}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:.45em .9em;border-radius:999px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.chips a:hover{border-color:var(--gold)}

/* Hero */
.hero{position:relative;color:#F7F5F0;background:#1B2A4A;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-2}
.hero-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
.hero-bg img.on{opacity:1;animation:kb 6s ease-out both}@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}.hero h1,.hero-sub,.hero .label{text-shadow:0 2px 12px rgba(0,0,0,.65)}.hero-dots{display:flex;gap:6px}.hero-dots i{width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.4)}.hero-dots i.on{background:#D4AF37}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(17,27,49,.25) 0%,rgba(17,27,49,.45) 45%,rgba(17,27,49,.82) 100%)}
.hero-in{padding-block:72px 56px;display:grid;gap:28px;max-width:780px}
.hero .label{color:#D4AF37}
.hero h1{font-size:clamp(2.3rem,6vw,4.4rem);font-weight:800;min-height:2.3em;transition:opacity .5s ease}
.hero h1 em{font-style:italic;color:#D4AF37;font-weight:700}
.hero-sub{font-size:1.1rem;color:#d7dceb;max-width:60ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px}
.cefr{display:grid;gap:8px;max-width:620px}
.cefr-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.cefr-bar span{font-family:var(--f-mono);font-size:.75rem;text-align:center;padding:.4em 0;border-radius:6px;background:rgba(255,255,255,.08);color:#d7dceb}
.cefr-bar span:nth-child(1){background:rgba(212,175,55,.25)}.cefr-bar span:nth-child(2){background:rgba(212,175,55,.38)}.cefr-bar span:nth-child(3){background:rgba(212,175,55,.52)}.cefr-bar span:nth-child(4){background:rgba(212,175,55,.66);color:#1B2A4A}.cefr-bar span:nth-child(5){background:rgba(212,175,55,.82);color:#1B2A4A}.cefr-bar span:nth-child(6){background:#D4AF37;color:#1B2A4A;font-weight:700}
.cefr small{color:#b9c2d6;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.12);border-radius:var(--r);overflow:hidden;max-width:780px}
.stats div{background:rgba(17,27,49,.7);padding:16px}
.stats b{display:block;font-family:var(--f-display);font-size:1.7rem;color:#D4AF37;font-variant-numeric:tabular-nums}
.stats span{font-size:.85rem;color:#d7dceb}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.hero-in{padding-block:48px 40px}}

/* Sections */
section.sec{padding-block:72px}
section.sec.band{background:var(--band);color:var(--band-fg)}
section.sec.band .muted{color:var(--band-muted)}
section.sec.band .card .muted{color:var(--muted)}
section.sec.alt{background:var(--surface-2)}
.sec-head{display:grid;gap:10px;margin-bottom:32px;max-width:720px}
.sec-head .label{color:var(--red)}
.band .sec-head .label{color:#D4AF37}
.sec-head h2{font-size:clamp(1.8rem,4vw,2.7rem);font-weight:700}
.muted{color:var(--muted)}
.more{margin-top:24px;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* Gallery */
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:220px;grid-auto-flow:dense;gap:12px}
.gal figure{margin:0;position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.gal figure.big{grid-column:span 2;grid-row:span 2}
.gal img{width:100%;height:100%;object-fit:cover}
.gal figcaption{position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;font-size:.88rem;color:#fff;background:linear-gradient(transparent,rgba(17,27,49,.88))}
@media (max-width:820px){.gal{grid-template-columns:repeat(2,1fr);grid-auto-rows:180px}}
@media (max-width:460px){.gal{grid-template-columns:1fr;grid-auto-rows:240px}.gal figure.big{grid-column:auto;grid-row:span 1}}

/* Level test */
.test{max-width:760px;margin:0 auto;padding:28px}
.test-grid{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.92rem}
input,textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:.7em .85em;width:100%}
textarea{min-height:96px;resize:vertical}
.q-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--red);transition:width .3s ease}
.q-text{font-family:var(--f-display);font-size:1.45rem;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:.9em 1.1em;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:500 1rem var(--f-body);cursor:pointer}
.opt:hover{border-color:var(--gold)}
.result{text-align:center;display:grid;gap:14px;justify-items:center}
.result .lvl{font-family:var(--f-mono);font-size:3.4rem;font-weight:700;color:var(--red);line-height:1}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* Videos */
.vids{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.vid{display:grid;gap:10px;text-decoration:none;color:inherit}
.vid .thumb{position:relative;aspect-ratio:9/12;border-radius:var(--r);overflow:hidden;background:#24365e;max-width:100%}
.vid .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease}
.vid:hover .thumb img{transform:scale(1.04)}
.vid .play{position:absolute;left:50%;top:68%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#C8102E;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.vid .play::before{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.vid .plat{position:absolute;top:10px;left:10px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;background:rgba(17,27,49,.85);color:#fff;padding:.3em .6em;border-radius:6px}
.vid b{font-weight:600;font-size:.98rem;line-height:1.35}
@media (max-width:900px){.vids{grid-template-columns:repeat(2,1fr)}}

/* Services */
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.svc .card{padding:22px;display:grid;gap:8px;align-content:start}
.svc .ic{font-size:1.7rem}
.svc h3{font-size:1.15rem}
.svc p{font-size:.94rem;color:var(--muted)}
@media (max-width:980px){.svc{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.svc{grid-template-columns:1fr}}

/* Founder */
.bio{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;align-items:start}
.bio-photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bio-photos img{width:100%;border-radius:var(--r);object-fit:cover;aspect-ratio:4/5}
.bio-photos img:first-child{grid-column:span 2}
.bio-photos.one img{grid-column:span 2}
.bio h3{font-size:2rem}
.bio .role{color:#D4AF37;font-family:var(--f-mono);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;margin:6px 0 16px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tags span{font-size:.82rem;padding:.35em .8em;border-radius:999px;border:1px solid rgba(212,175,55,.6);color:#f1e3b0}
.press{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px}
.press article{display:grid;gap:10px}
.press img{border-radius:var(--r);aspect-ratio:16/10;object-fit:cover;width:100%}
.press figcaption{font-size:.8rem;color:var(--band-muted);font-style:italic}
.press h4{font-family:var(--f-display);font-size:1.35rem;margin:0}
.extra{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:28px}
.extra img{aspect-ratio:1;object-fit:cover;border-radius:10px;width:100%}
@media (max-width:820px){.bio,.press{grid-template-columns:1fr}.extra{grid-template-columns:repeat(3,1fr)}}

/* Testimonials */
.marquee{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;gap:16px;width:max-content;animation:scroll 40s linear infinite}
.marquee:hover .track{animation-play-state:paused}
@keyframes scroll{to{transform:translateX(-50%)}}
.tcard{width:320px;padding:22px;display:grid;gap:12px}
.tcard p{font-family:var(--f-display);font-size:1.05rem;font-style:italic}
.tcard b{font-size:.9rem}.tcard small{color:var(--muted)}

/* Courses / specials / shop / resources */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.grid3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid3{grid-template-columns:1fr}}
.item{overflow:hidden;display:grid;align-content:start}
.item .cover{aspect-ratio:16/10;background:var(--surface-2);overflow:hidden}
.item .cover img{width:100%;height:100%;object-fit:cover}
.item .body{padding:20px;display:grid;gap:10px}
.item h3{font-size:1.25rem}
.badge{justify-self:start;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.3em .65em;border-radius:6px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.price{font-family:var(--f-display);font-weight:700;font-size:1.25rem;color:var(--red)}
.links{display:grid;gap:6px;padding:12px;border-radius:10px;background:var(--surface-2)}
.links a{font-weight:600}
.lock{display:flex;flex-wrap:wrap;gap:8px}
.lock input{flex:1;min-width:0}
.feat{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:0;overflow:hidden;margin-bottom:26px;background:#1B2A4A;color:#F7F5F0;border-radius:var(--r)}
.feat .txt{padding:36px;display:grid;gap:14px;align-content:center}
.feat .label{color:#D4AF37}
.feat h3{font-size:clamp(2rem,4.5vw,3.2rem);font-weight:800;letter-spacing:.01em}
.feat p{color:#d7dceb}
.feat .price{color:#D4AF37;font-size:1.6rem}
.feat .media{min-height:260px;background:#24365e}
.feat .media img{width:100%;height:100%;object-fit:cover}
@media (max-width:760px){.feat{grid-template-columns:1fr}.feat .txt{padding:26px}}
.new{color:#C8102E;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}

/* Spotlight (lien publicitaire) */
.spot{background:#1B2A4A;color:#F7F5F0;padding-block:48px;border-bottom:6px solid #C8102E}
.spot-in{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px;align-items:center}
.spot .label{color:#D4AF37}
.spot h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:800;margin:10px 0 14px}
.spot p{color:#d7dceb;max-width:60ch}
.spot .price{color:#D4AF37;font-size:1.7rem;display:block;margin:16px 0}
.spot .media{border-radius:var(--r);overflow:hidden;background:#24365e;aspect-ratio:4/3}
.spot .media img{width:100%;height:100%;object-fit:cover}
.spot .badge{background:rgba(255,255,255,.1);color:#F7F5F0;border-color:rgba(255,255,255,.2)}
@media (max-width:760px){.spot-in{grid-template-columns:1fr}}
.adlink{display:grid;gap:6px;padding:12px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--gold)}
.adlink code{font-family:var(--f-mono);font-size:.8rem;word-break:break-all}

/* Tests officiels */
.tests{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tests .card{padding:26px;display:grid;gap:12px}
@media (max-width:640px){.tests{grid-template-columns:1fr}}

/* FAQ */
.faq{max-width:820px;display:grid;gap:10px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 20px}
.faq summary{cursor:pointer;padding:18px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--f-mono);color:var(--red);font-size:1.2rem}
.faq details[open] summary::after{content:"–"}
.faq details p{padding:0 0 18px;color:var(--muted)}

/* Social + contact */
.social{display:flex;flex-wrap:wrap;gap:12px}
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.clist{display:grid;gap:14px}
.clist div{display:grid;gap:2px}
.clist .label{color:#D4AF37}
.clist b{font-size:1.1rem;word-break:break-word}
.mapcard{border-radius:var(--r);background:#24365e;padding:28px;display:grid;gap:14px;align-content:end;min-height:280px;position:relative;overflow:hidden;color:#F7F5F0}
.mapcard::before{content:"";position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(0deg,transparent 0 38px,rgba(212,175,55,.35) 38px 39px),repeating-linear-gradient(90deg,transparent 0 38px,rgba(212,175,55,.35) 38px 39px)}
.mapcard .pin{position:absolute;top:34%;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#C8102E;box-shadow:0 0 0 8px rgba(200,16,46,.25)}
.mapcard > *{position:relative}
@media (max-width:760px){.contact{grid-template-columns:1fr}}
footer{background:#0f1729;color:#b9c2d6;padding-block:28px;font-size:.88rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
footer button{background:none;border:0;color:#5f6b85;font:inherit;font-size:.78rem;cursor:pointer;text-decoration:underline}

/* Modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,16,30,.62);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--surface);color:var(--fg);border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:26px;display:grid;gap:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.modal-box h3{font-size:1.5rem}
.x{justify-self:end;background:none;border:0;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted)}
.copy{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-weight:600;word-break:break-all}
.copy button{margin-left:auto;flex:none}
.cert-img{border-radius:10px;border:1px solid var(--line);width:100%}
.note{font-size:.85rem;color:var(--muted)}

/* Admin */
.admin{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px)}
.admin-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.admin-top b{font-family:var(--f-display);font-size:1.2rem;margin-right:auto}
.admin-main{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:0}
.admin-nav{border-right:1px solid var(--line);overflow:auto;padding:10px;display:grid;gap:4px;align-content:start}
.admin-nav button{text-align:left;padding:.6em .8em;border-radius:8px;border:0;background:none;color:var(--fg);font:500 .92rem var(--f-body);cursor:pointer}
.admin-nav button.on{background:var(--surface-2);font-weight:700}
.admin-body{overflow:auto;padding:20px 16px 80px}
.admin-body h2{font-size:1.6rem;margin-bottom:6px}
.ed-item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px;display:grid;gap:12px;background:var(--surface)}

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }

function list(k){ return Array.isArray(DATA[k])?DATA[k]:[]; }

function slugify(t){ return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'formation'; }
function slugOf(it){ if(!it.slug) it.slug=slugify(it.title); return it.slug; }
function progLink(it){ return String(g().siteUrl||'').replace(/#.*$/,'')+'#'+slugOf(it); }
function programs(){

  return out;
}
function currentProg(){ var h=decodeURIComponent((location.hash||'').slice(1)); var sl=h.indexOf('p-')===0?h.slice(2):h; if(!sl) return null; return programs().filter(function(o){return slugOf(o.it)===sl;})[0]||null; }

}

/* ---------- level test ---------- */
var QUESTIONS = window.TEST_Q;
function levelOf(s){ return s<=5?'A1':s<=10?'A2':s<=15?'B1':'B2+'; }
var LEVEL_TXT = {
 'A1':"Vous posez les premières bases. Avec un accompagnement régulier, vous pouvez vite tenir des échanges simples.",
 'A2':"Vous comprenez l'essentiel des phrases courantes. Il est temps de pratiquer l'oral pour gagner en aisance.",
 'B1':"Vous vous débrouillez dans la plupart des situations. La pratique intensive vous fera passer un vrai cap.",
 'B2+':"Très bon niveau ! Perfectionnez votre aisance, votre accent et votre anglais professionnel."
};
function renderTest(){
  var t = state.test, el = $('#test-box'); if(!el) return;
  if(t.step==='intro'){
    el.innerHTML = '<form id="test-form" class="test-grid">'+
      '<p class="muted">20 questions, environ 5 minutes. Résultat immédiat sur l\'échelle européenne (CECR).</p>'+
      '<div class="field"><label for="t-name">Votre nom</label><input id="t-name" required autocomplete="name" value="'+esc(t.name)+'"></div>'+
      '<div class="field"><label for="t-phone">Votre téléphone (WhatsApp)</label><input id="t-phone" required inputmode="tel" autocomplete="tel" value="'+esc(t.phone)+'"></div>'+
      '<button class="btn btn-red" type="submit">Commencer le test</button></form>';
    $('#test-form').addEventListener('submit',function(e){ e.preventDefault(); t.name=$('#t-name').value.trim(); t.phone=$('#t-phone').value.trim(); if(!t.name||!t.phone) return; t.step='q'; t.i=0; t.score=0; renderTest(); });
  } else if(t.step==='q'){
    var q = QUESTIONS[t.i];
    el.innerHTML = '<div class="q-meta"><span class="label">Question '+(t.i+1)+' / '+QUESTIONS.length+'</span><div class="progress"><i style="width:'+(t.i/QUESTIONS.length*100)+'%"></i></div></div>'+
      '<p class="q-text">'+esc(q[0])+'</p><div class="opts">'+q[1].map(function(o,k){return '<button class="opt" data-k="'+k+'">'+esc(o)+'</button>';}).join('')+'</div>';
    el.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click',function(){ if(+b.dataset.k===q[2]) t.score++; t.i++; t.step = t.i>=QUESTIONS.length?'done':'q'; renderTest(); }); });
  } else {
    var lv = levelOf(t.score);
    var msg = "Bonjour Winners' English Center ! Je suis "+t.name+" ("+t.phone+"). J'ai fait le test de niveau sur votre site : "+t.score+"/"+QUESTIONS.length+", niveau "+lv+". J'aimerais connaître le programme adapté.";
    el.innerHTML = '<div class="result"><span class="label">Votre niveau estimé</span><span class="lvl">'+lv+'</span><p><b>'+t.score+' / '+QUESTIONS.length+'</b> bonnes réponses</p><p class="muted" style="max-width:52ch">'+esc(LEVEL_TXT[lv])+'</p>'+
      '<div class="row-btns"><a class="btn btn-wa" target="_blank" rel="noopener" href="'+wa(msg)+'">Envoyer mon résultat sur WhatsApp</a>'+
      '<a class="btn btn-ghost" href="mailto:'+esc(g().email)+'?subject='+encodeURIComponent('Résultat test de niveau : '+lv)+'&body='+encodeURIComponent(msg)+'">Par email</a></div>'+
      '<p class="note">Email : '+esc(g().email)+'</p><button class="btn btn-ghost" id="t-again">Refaire le test</button></div>';
    $('#t-again').addEventListener('click',function(){ t.step='intro'; renderTest(); });
  }
}

function modal(html){
  var m=document.createElement('div'); m.className='modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
  m.innerHTML='<div class="modal-box"><button class="x" aria-label="Fermer">×</button>'+html+'</div>';
  document.body.appendChild(m);
  function close(){ m.remove(); document.removeEventListener('keydown',kd); }
  function kd(e){ if(e.key==='Escape') close(); }
  m.addEventListener('click',function(e){ if(e.target===m||e.target.classList.contains('x')) close(); });
  document.addEventListener('keydown',kd);
  var f=m.querySelector('input,button.btn,a.btn'); if(f) f.focus();
  return {el:m, close:close};
}

function openCert(course){
  if(!course) return;
  var m=modal('<h3>Obtenir mon attestation</h3><p class="muted">Cours : <b>'+esc(course.title)+'</b>. Saisissez votre nom et le score obtenu au test final du cours. L\'attestation est délivrée à partir de 70/100.</p>'+
    '<form id="cert-form" class="test-grid"><div class="field"><label for="c-name">Nom complet</label><input id="c-name" required></div><div class="field"><label for="c-score">Score au test final (sur 100)</label><input id="c-score" type="number" min="0" max="100" required></div><button class="btn btn-red" type="submit">Générer</button></form><div id="cert-out"></div>');
  $('#cert-form',m.el).addEventListener('submit',function(e){
    e.preventDefault(); var name=$('#c-name',m.el).value.trim(), sc=+$('#c-score',m.el).value, out=$('#cert-out',m.el);
    if(sc<70){ out.innerHTML='<p class="note" style="color:var(--red)">Score inférieur à 70/100 : révisez le cours et repassez le test, vous y êtes presque.</p>'; return; }
    var cv=drawCert(name,course.title,sc), url=cv.toDataURL('image/png');
    out.innerHTML='<img class="cert-img" src="'+url+'" alt="Attestation de '+esc(name)+'"><div class="row-btns"><button class="btn btn-gold" id="cert-dl" hidden>Enregistrer l\'image</button></div><p class="note" id="cert-note">Sur téléphone : appui long sur l\'image pour l\'enregistrer.</p>';
    if(window.claude&&claude.use){ claude.use('downloads').then(function(dl){ if(!dl) return; var b=$('#cert-dl',m.el); b.hidden=false; b.addEventListener('click',function(){ cv.toBlob(function(blob){ dl.save({filename:'attestation-'+name.replace(/[^\w-]+/g,'-')+'.png', data:blob}).catch(function(){ $('#cert-note',m.el).textContent='Enregistrement annulé. Vous pouvez aussi faire un appui long ou une capture d\'écran.'; }); }); }); }); }
  });
}
function drawCert(name,course,score){
  var c=document.createElement('canvas'); c.width=1600; c.height=1130; var x=c.getContext('2d');
  x.fillStyle='#F7F5F0'; x.fillRect(0,0,1600,1130);
  x.strokeStyle='#1B2A4A'; x.lineWidth=18; x.strokeRect(40,40,1520,1050);
  x.strokeStyle='#D4AF37'; x.lineWidth=4; x.strokeRect(78,78,1444,974);
  x.textAlign='center'; x.fillStyle='#1B2A4A';
  x.font='700 30px "Space Mono", monospace'; x.fillText("WINNERS' ENGLISH CENTER",800,190);
  x.font='800 92px Fraunces, Georgia, serif'; x.fillText('Attestation de réussite',800,320);
  x.font='400 34px Inter, sans-serif'; x.fillStyle='#5b6478'; x.fillText('décernée à',800,400);
  x.font='italic 700 84px Fraunces, Georgia, serif'; x.fillStyle='#C8102E'; x.fillText(name,800,510);
  x.font='400 34px Inter, sans-serif'; x.fillStyle='#1B2A4A'; x.fillText('pour avoir suivi le cours',800,600);
  x.font='700 46px Fraunces, Georgia, serif'; x.fillText(course,800,670);
  x.font='400 32px Inter, sans-serif'; x.fillStyle='#5b6478'; x.fillText('avec un score déclaré de '+score+'/100 au test final',800,740);
  var d=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  x.font='400 28px Inter, sans-serif'; x.fillText('Cocody, Riviera Palmeraie, le '+d,800,830);
  x.fillStyle='#1B2A4A'; x.font='700 30px Fraunces, Georgia, serif'; x.fillText('Coach Winner',1200,960); x.fillRect(1040,910,320,2);
  x.font='400 22px Inter, sans-serif'; x.fillStyle='#5b6478'; x.fillText('Formateur, fondateur',1200,995);
  var lg=new Image(); lg.src=g().logo; try{ x.drawImage(lg,330,880,140,140); }catch(e){}
  return c;
}

   extra:[{key:'heroTitles', label:'Titres de l\'accueil (français / anglais)', fields:[['0','Français',TXT],['1','Anglais',TXT]], arr:true},
          {key:'heroImages', label:'Photos de fond de l\'accueil (3 conseillées)', single:IMG},
          {key:'stats', label:'Chiffres clés (4)', fields:[['n','Chiffre',TXT],['l','Libellé',TXT]]}]},

          {key:'articles', label:'Articles (parcours, naissance du centre)', fields:[['img','Photo',IMG],['caption','Légende photo',TXT],['title','Titre',TXT],['text','Texte',AREA]]},
          {key:'extraPhotos', label:'Galerie (5 photos)', single:IMG}]},
 {key:'testimonials', label:'Témoignages', fields:[['text','Témoignage',AREA],['name','Nom',TXT],['role','Profession / niveau',TXT]]},
 {key:'specialFeatured', label:'Programme à la une', obj:true, adlink:true, fields:[['title','Titre',TXT],['slug','Code du lien publicitaire',TXT],['desc','Description',AREA],['price','Prix',TXT],['videoUrl','Lien vidéo',URL_],['image','Image',IMG]]},
 {key:'specials', label:'Programmes spéciaux', adlink:true, fields:[['title','Titre',TXT],['slug','Code du lien publicitaire',TXT],['audience','Public',TXT],['desc','Description',AREA],['price','Prix',TXT],['date','Date d\'ajout (AAAA-MM-JJ)',TXT]], newFirst:true},
 {key:'courses', label:'Cours préenregistrés', adlink:true, fields:[['title','Titre',TXT],['slug','Code du lien publicitaire',TXT],['level','Niveau',TXT],['desc','Description',AREA],['price','Prix',TXT],['access','Durée d\'accès',TXT],['cover','Couverture',IMG],['videoUrl','Vidéo de présentation (lien)',URL_],['code','Code d\'accès',TXT],['links','Liens (un par ligne : Nom | https://…)',AREA]]},
 {key:'shop', label:'Boutique (ebooks)', fields:[['title','Titre',TXT],['desc','Description',AREA],['price','Prix',TXT],['cover','Couverture',IMG],['payUrl','Lien de paiement',URL_],['audioUrl','Lien audio (optionnel)',URL_]]},
 {key:'resources', label:'Ressources gratuites', fields:[['title','Titre',TXT],['desc','Description',AREA],['cover','Couverture',IMG],['url','Lien de téléchargement',URL_]]},
 {key:'officialTests', label:'Tests officiels', fields:[['title','Titre',TXT],['desc','Description',AREA],['code','Code d\'accès',TXT],['link','Lien du test',URL_],['audio','Lien audio (optionnel)',URL_]]},
 {key:'faq', label:'FAQ', fields:[['q','Question',TXT],['a','Réponse',AREA]]}
];
var adminSec='general', dirty=false;
function askAdmin(){
  var m=modal('<h3>Espace administration</h3><form id="adm-f" class="test-grid"><div class="field"><label for="adm-code">Code d\'accès</label><input id="adm-code" type="password" autocomplete="off"></div><button class="btn btn-red" type="submit">Entrer</button><p class="note" id="adm-err"></p></form>');
  $('#adm-f',m.el).addEventListener('submit',function(e){ e.preventDefault(); if($('#adm-code',m.el).value===String(g().adminCode)){ m.close(); openAdmin(); } else $('#adm-err',m.el).textContent='Code incorrect.'; });
}
function openAdmin(){
  var a=document.createElement('div'); a.className='admin'; a.id='admin';
  a.innerHTML='<div class="admin-top"><b>Administration du site</b><span class="status" id="adm-status">Les modifications s\'appliquent à l\'aperçu. Cliquez sur Enregistrer pour les publier.</span><button class="btn btn-ghost" id="adm-close">Voir le site</button><button class="btn btn-red" id="adm-save">Enregistrer</button></div>'+
    '<div class="admin-main"><nav class="admin-nav">'+SCHEMA.map(function(s){return '<button data-s="'+s.key+'">'+esc(s.label)+'</button>';}).join('')+'</nav><div class="admin-body" id="adm-body"></div></div>';
  document.body.appendChild(a); document.body.style.overflow='hidden';
  a.querySelectorAll('[data-s]').forEach(function(b){ b.addEventListener('click',function(){ adminSec=b.dataset.s; drawAdmin(); }); });
  $('#adm-close').addEventListener('click',function(){ a.remove(); document.body.style.overflow=''; render(); if(dirty) toastBar(); });
  $('#adm-save').addEventListener('click',save);
  drawAdmin();
}
function toastBar(){
  var t=document.getElementById('unsaved'); if(t) t.remove();
  t=document.createElement('div'); t.id='unsaved'; t.style.cssText='position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:#1B2A4A;color:#F7F5F0;box-shadow:var(--shadow)';
  t.innerHTML='<span>Aperçu avec modifications non enregistrées.</span><span style="display:flex;gap:8px"><button class="btn btn-ghost" id="u-admin">Retour à l\'admin</button><button class="btn btn-red" id="u-save">Enregistrer</button></span>';
  document.body.appendChild(t);
  $('#u-admin').addEventListener('click',function(){ t.remove(); openAdmin(); });
  $('#u-save').addEventListener('click',function(){ t.remove(); openAdmin(); save(); });
}
function fieldHtml(id,label,type,val){
  if(type===IMG) return '<div class="field"><span style="font-weight:600;font-size:.92rem">'+esc(label)+'</span><div class="imgf">'+(val?'<img src="'+safeUrl(val)+'" alt="">':'<span class="note">Aucune photo</span>')+'<label class="mini" for="'+id+'">Choisir une photo</label><input id="'+id+'" type="file" accept="image/*" hidden data-img>'+(val?'<button class="mini" data-clear="'+id+'">Retirer</button>':'')+'</div></div>';
  if(type===AREA) return '<div class="field"><label for="'+id+'">'+esc(label)+'</label><textarea id="'+id+'">'+esc(val)+'</textarea></div>';
  if(type===BOOL) return '<label class="chk" for="'+id+'"><input id="'+id+'" type="checkbox" '+(val?'checked':'')+'> '+esc(label)+'</label>';
  return '<div class="field"><label for="'+id+'">'+esc(label)+'</label><input id="'+id+'" value="'+esc(val)+'"></div>';
}
function drawAdmin(){
  document.querySelectorAll('#admin [data-s]').forEach(function(b){ b.classList.toggle('on',b.dataset.s===adminSec); });
  var S=SCHEMA.filter(function(s){return s.key===adminSec;})[0], body=$('#adm-body'), h='<h2>'+esc(S.label)+'</h2>';
  var refs=[];
  function reg(obj,k,type){ var id='f'+refs.length; refs.push({id:id,obj:obj,k:k,type:type}); return id; }
  var adl=!!S.adlink;
  function listEd(arr, fields, single, title, path){
    var out='';
    arr.forEach(function(it,i){
      out+='<div class="ed-item"><div class="ed-head"><b>'+esc(title)+' '+(i+1)+'</b><button data-mv="'+path+'|'+i+'|-1" aria-label="Monter">↑</button><button data-mv="'+path+'|'+i+'|1" aria-label="Descendre">↓</button><button data-rm="'+path+'|'+i+'">Supprimer</button></div>';
      if(adl && it && it.title){ slugOf(it); out+=adBox(it,path+'_'+i); }
      if(single){ out+=fieldHtml(reg(arr,i,single),'Valeur',single,it); }
      else fields.forEach(function(f){ out+=fieldHtml(reg(it,f[0],f[2]),f[1],f[2],it[f[0]]); });
      out+='</div>';
    });
    return out+'<p style="margin-top:12px"><button class="btn btn-ghost" data-add="'+path+'">+ Ajouter</button></p>';
  }
  if(S.obj){
    var o=DATA[S.key]=DATA[S.key]||{};
    if(S.adlink && o.title){ slugOf(o); h+='<div class="ed-item">'+adBox(o,'feat')+'</div>'; }
    h+='<div class="ed-item">'+S.fields.map(function(f){return fieldHtml(reg(o,f[0],f[2]),f[1],f[2],o[f[0]]);}).join('')+'</div>';
    (S.extra||[]).forEach(function(x){ o[x.key]=o[x.key]||[]; h+='<h3 style="margin-top:28px;font-size:1.2rem">'+esc(x.label)+'</h3>'+listEd(o[x.key],x.fields,x.single,'Élément',S.key+'.'+x.key); });
  } else {
    DATA[S.key]=DATA[S.key]||[];
    if(S.key==='testimonials') h+='<p class="note">La section n\'apparaît sur le site que s\'il y a au moins un témoignage. N\'ajoutez que de vrais avis d\'apprenants.</p>';
    if(S.newFirst) h+='<p class="note">Sur le site, les programmes les plus récents (date d\'ajout) apparaissent en premier.</p>';
    if(['courses','shop','resources'].indexOf(S.key)>=0) h+='<p class="note">La section reste masquée tant que la liste est vide.</p>';
    h+=listEd(DATA[S.key],S.fields,null,'Élément',S.key);
  }
  if(adl) h='<p class="note">Chaque formation a son lien publicitaire : copiez-le dans votre campagne Facebook. La personne qui clique arrive directement sur la formation, puis peut découvrir tout le site. Si vous changez le code du lien, l\'ancien lien ne marche plus.</p>'+h;
  body.innerHTML=h;
  bindCopy(body);
  refs.forEach(function(r){
    var el=document.getElementById(r.id); if(!el) return;
    if(r.type===IMG){
      el.addEventListener('change',function(){ var f=el.files[0]; if(!f) return; compress(f).then(function(d){ r.obj[r.k]=d; dirty=true; drawAdmin(); }); });
      var c=body.querySelector('[data-clear="'+r.id+'"]'); if(c) c.addEventListener('click',function(){ r.obj[r.k]=''; dirty=true; drawAdmin(); });
    } else el.addEventListener('input',function(){ r.obj[r.k]= r.type===BOOL?el.checked:el.value; dirty=true; });
    if(r.type===BOOL) el.addEventListener('change',function(){ r.obj[r.k]=el.checked; dirty=true; });
  });
  function arrAt(path){ var p=path.split('.'), a=DATA[p[0]]; return p[1]?a[p[1]]:a; }
  body.querySelectorAll('[data-add]').forEach(function(b){ b.addEventListener('click',function(){
    var path=b.dataset.add, a=arrAt(path), p=path.split('.'), S2=SCHEMA.filter(function(s){return s.key===p[0];})[0], spec=p[1]?S2.extra.filter(function(x){return x.key===p[1];})[0]:S2;
    if(spec.single) a.push(''); else if(spec.arr) a.push(['','']); else { var n={}; spec.fields.forEach(function(f){n[f[0]]=f[2]===BOOL?false:'';}); if(spec.newFirst) n.date=new Date().toISOString().slice(0,10); a.push(n); }
    dirty=true; drawAdmin(); }); });
  body.querySelectorAll('[data-rm]').forEach(function(b){ b.addEventListener('click',function(){ var q=b.dataset.rm.split('|'); arrAt(q[0]).splice(+q[1],1); dirty=true; drawAdmin(); }); });
  body.querySelectorAll('[data-mv]').forEach(function(b){ b.addEventListener('click',function(){ var q=b.dataset.mv.split('|'), a=arrAt(q[0]), i=+q[1], j=i+(+q[2]); if(j<0||j>=a.length) return; var t=a[i]; a[i]=a[j]; a[j]=t; dirty=true; drawAdmin(); }); });
}
function adBox(it,id){
  var base=String(g().siteUrl||'');
  return '<div class="adlink"><span class="label">Lien publicitaire</span>'+(base?'<div class="copy"><code id="ad-'+esc(id)+'">'+esc(progLink(it))+'</code><button class="mini" data-copy="ad-'+esc(id)+'">Copier</button></div>':'<span class="note">Renseignez d\'abord l\'adresse du site dans l\'onglet Général.</span>')+'</div>';
}
function compress(file){
  return new Promise(function(res){
    var r=new FileReader(); r.onload=function(){ var im=new Image(); im.onload=function(){ var max=1400, w=im.width, h=im.height; if(w>max){h=Math.round(h*max/w); w=max;} if(h>max){w=Math.round(w*max/h); h=max;} var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h); res(c.toDataURL('image/jpeg',0.78)); }; im.src=r.result; }; r.readAsDataURL(file);
  });
}
function buildDoc(){
  var json=JSON.stringify(DATA).replace(/<\//g,'<\\/');
  var close='</'+'script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'+
    '<title>'+esc(g().name)+'</title>\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">\n'+
    '<style id="site-style">'+STYLE_SRC+'</style>\n<div id="app"></div>\n'+
    '<script id="site-data" type="application/json">'+json+close+'\n'+
    '<script id="site-app">'+APP_SRC+close+'\n</body></html>';
}
function setStatus(t,bad){ var s=$('#adm-status'); if(s){ s.textContent=t; s.style.color=bad?'var(--red)':''; } }
function save(){
  var btn=$('#adm-save'); if(btn) btn.disabled=true; setStatus('Publication en cours…');
  var html=buildDoc();
  if(!(window.claude&&claude.use)){ setStatus('Enregistrement indisponible ici : ouvrez le site depuis votre compte Claude.',true); if(btn) btn.disabled=false; return; }
  claude.use('artifact').then(function(art){
    if(!art){ setStatus('Enregistrement indisponible dans cette vue. Ouvrez le site depuis votre compte Claude.',true); if(btn) btn.disabled=false; return; }
    return art.publish(html).then(function(){ dirty=false; setStatus('Publié. Le site se recharge avec vos modifications.'); },function(err){
      var c=err&&err.code, msg={not_writer:'Seul le propriétaire du site peut enregistrer.',not_granted:'Seul le propriétaire du site peut enregistrer.',too_large:'Le site est trop lourd : retirez quelques photos.',conflict:'Une autre version vient d\'être publiée : la page se recharge.',rate_limited:'Trop d\'enregistrements rapprochés : réessayez dans une minute.'}[c]||'Échec de la publication ('+(c||'erreur')+'). Réessayez.';
      setStatus(msg,true); if(btn) btn.disabled=false;
    });
  });
}
window.addEventListener('beforeunload',function(e){ if(dirty){ e.preventDefault(); e.returnValue=''; } });

window.addEventListener('hashchange',function(){ if(currentProg()){ render(); window.scrollTo(0,0); } });
render();
if(currentProg()) window.scrollTo(0,0);
})();
</script>
